<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        use css units
    </title>
    <style>

        html {
            font-size: 50px;
        }

        * {
            margin: 0;
        }

        div {
            font-size: 50px;
        }

        p {
            font-size: 10px;
        }

        a {
            font-size: 2rem;
        }

        i {
            font-size: 1em;
        }

        div {
             background-color: brown;
             height: 100vh;
             width: 50vw;
        }
    </style>
</head>
<body>
    <div>
        <p>Hello</p>
        <a>Hi</a>
        <br>
        <i>Italic</i>
    </div>
</body>
</html>
