<html>

<head>

    <style>
        .container {
            border: 2px solid gray;
            padding: 20px;
        }

        .box {
            width: 80px;
            height: 80px;
            color: white;
            display: inline-block;
            text-align: center;
            line-height: 80px;
        }

        .red {
            background: #E74C3C;
        }

        .blue {
            background: #3498DB;
        }

        .green {
            background: #2ECC71;
        }

        .blue {
            position: absolute;
            left: 40px;
            top: 20px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box red">1</div>
        <div class="box blue">2</div>
        <div class="box green">3</div>
    </div>
</body>

</html>
