<body>
    <h2>Functions</h2>
    <p>1. A = 10, B = 20</p>
    <p>A + B = <span id="resultSumAB"></span></p>
    <!-- <button onclick="sumValue(10, 20, 'resultSumAB')">Show result</button> -->

    <p>2. C = 50, D = 20</p>

    <!-- <button onclick="sumValue(20, 50, 'resultSumCD')">Show result</button> -->

    <p>3. E = 50, F = 20</p>

    <button onclick="totalValue(50, 20, '*', 'resultMultiplyCD')">Show result</button>
