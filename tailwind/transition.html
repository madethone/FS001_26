<!DOCTYPE html>
<html>
    <head>
        <title>Use transition tailwind</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    </head>
    <body>
        
        <button class="bg-blue-500 px-4 rounded hover:-translate-x-1 hover:scale-110 transition delay-100 duration-700 ease-out-in">
            Save Changes
        </button>
        <button class="bg-blue-500 px-4 rounded transition delay-150 duration-300 ease-in-out hover:-translate-y-1 hover:scale-110 hover:bg-indigo-500">
            Save Changes
          </button>
    </body>
</html>
