<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind Button</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>
    <button class="
       border-[0px] bg-blue-400 rounded-lg px-[20px] py-[10px] text-white hover:bg-blue-700 text-sm
     ">
        Save
    </button>
    <button class="
    border-[0px] bg-red-400 rounded-lg px-[20px] py-[10px] text-white hover:bg-red-700 text-sm
    ">
        Delete
    </button>
    <button class="
    border-[0px] bg-green-400 rounded-lg px-[20px] py-[10px] text-white hover:bg-green-700 text-sm
    ">
        Update
    </button>
    <button class="
    border-[0px] bg-gray-400 rounded-lg px-[20px] py-[10px] text-white hover:bg-gray-700 text-sm
    ">
        View
    </button>
</body>

</html>
