<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Use hover style with tailwind</title>
</head>
<body>
    <button class="bg-blue-300 rounded-sm ps-[10px] pe-[10px]">
        Save
    </button>

    <button class="bg-blue-300 rounded-sm px-[10px]">
        Save
    </button>

    <button class="bg-blue-300 rounded-sm pt-[10px] pb-[10px]">
        Save
    </button>

    <button class="bg-blue-300 rounded-sm py-[10px]">
        Save
    </button>

    <button class="bg-blue-300 rounded-sm pt-[10px] pb-[10px] ps-[10px] pe-[10px]">
        Save
    </button>

    <!-- Use hover property -->
    <button class="bg-blue-300 rounded-sm p-[10px] hover:bg-blue-700 hover:text-white hover:rounded-lg">
        Save
    </button>
</body>
</html>
